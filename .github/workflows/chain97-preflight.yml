name: Chain 97 acceptance preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chain97-acceptance-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Chain 97 executor wallets and RPCs
        env:
          CHAIN97_PRIVATE_KEY_A: ${{ secrets.CHAIN97_PRIVATE_KEY_A }}
          CHAIN97_PRIVATE_KEY_B: ${{ secrets.CHAIN97_PRIVATE_KEY_B }}
          CHAIN97_PRIVATE_KEY_C: ${{ secrets.CHAIN97_PRIVATE_KEY_C }}
          CHAIN97_RPC_PRIMARY: ${{ secrets.CHAIN97_RPC_PRIMARY }}
          CHAIN97_RPC_SECONDARY: ${{ secrets.CHAIN97_RPC_SECONDARY }}
          CHAIN97_MIN_BALANCE_WEI: ${{ vars.CHAIN97_MIN_BALANCE_WEI }}
        run: pnpm --filter @70x/acceptance run preflight
