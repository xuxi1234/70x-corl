name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: forge fmt --check
        working-directory: contracts
      - run: forge test
        working-directory: contracts
      - name: Generated ABI drift gate
        run: pnpm protocol:abi:check
      - name: Storage layout drift gate
        run: ./scripts/check-storage-layout.sh
        working-directory: contracts
      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          fail-on: high
      - name: Evidence schema gate
        run: pnpm --filter @70x/acceptance test
