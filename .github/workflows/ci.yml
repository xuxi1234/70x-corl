name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - run: pnpm install --frozen-lockfile
      - name: Build protocol dependency
        run: pnpm --filter @70x/protocol build
      - name: Build Foundry artifacts for acceptance executor tests
        run: forge build
        working-directory: contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: forge fmt --check
        working-directory: contracts
      - run: forge test
        working-directory: contracts
      - name: Capture generated Flap ABI and storage fingerprint
        run: |
          mkdir -p /tmp/corla-ci
          pnpm protocol:abi
          cp packages/protocol/src/abi/generated.ts /tmp/corla-ci/generated.ts
          cd contracts
          forge inspect FlapMintVault storage-layout --json | node scripts/storage-layout-fingerprint.mjs > /tmp/corla-ci/flap-storage-hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: flap-generated-snapshot
          path: /tmp/corla-ci
      - name: Generated ABI drift gate
        run: pnpm protocol:abi:check
      - name: Storage layout fingerprint regression
        run: node --test scripts/storage-layout-fingerprint.test.mjs
        working-directory: contracts
      - name: Storage layout drift gate
        run: ./scripts/check-storage-layout.sh
        working-directory: contracts
      - name: Slither static analysis
        uses: crytic/slither-action@v0.4.1
        with:
          target: contracts
          fail-on: high
      - name: Evidence schema gate
        run: pnpm --filter @70x/acceptance test
