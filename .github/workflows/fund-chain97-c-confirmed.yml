name: Confirmed Chain 97 C funding

on:
  push:
    branches:
      - ops/fund-chain97-c-confirmed-20260830

permissions:
  contents: read

concurrency:
  group: confirmed-chain97-c-funding
  cancel-in-progress: false

jobs:
  fund:
    environment: chain97-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate confirmed funding script
        working-directory: apps/acceptance
        run: node --check src/chain97/fund-c-confirmed.mjs
      - name: Fund C using exact confirmed transfers
        working-directory: apps/acceptance
        env:
          CHAIN97_PRIVATE_KEY_A: ${{ secrets.CHAIN97_PRIVATE_KEY_A }}
          CHAIN97_PRIVATE_KEY_B: ${{ secrets.CHAIN97_PRIVATE_KEY_B }}
          TRANSFER_AUTHORIZATION: CONFIRMED_A_0_30_B_0_60_TO_C
        run: node src/chain97/fund-c-confirmed.mjs
      - name: Upload immutable public funding evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chain97-c-funding-evidence-${{ github.sha }}
          path: .chain97-funding/evidence.json
          if-no-files-found: warn
          retention-days: 90
